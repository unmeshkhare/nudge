<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080b14">
<meta name="nudge-ui" content="8">
<title>Nudge</title>
<style>
:root{--sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));--sab:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));--bg:#080b14;--card:rgba(255,255,255,.04);--line:rgba(255,255,255,.09);--txt:#e8ecf8;--dim:#7f89a8;--c1:#6ff3ff;--c2:#8a7bff;--pink:#ff7ad9;--gold:#ffd166;--ok:#5dffb0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{background:radial-gradient(900px 500px at 80% -10%,rgba(138,123,255,.18),transparent 60%),radial-gradient(700px 400px at -10% 30%,rgba(111,243,255,.10),transparent 60%),var(--bg)}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{padding:calc(var(--sat) + 14px) 18px 6px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:700;letter-spacing:.3em;font-size:13px;color:var(--c1)}
.chips{display:flex;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);padding:5px 10px;border-radius:99px;font-size:13px;display:flex;gap:5px;align-items:center}
main{flex:1;overflow-y:auto;padding:6px 16px 100px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;display:flex;background:rgba(8,11,20,.88);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(var(--sab) + 6px)}
nav button{flex:1;background:none;border:0;color:var(--dim);padding:8px 0;font-size:11px;letter-spacing:.08em;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:19px;font-weight:400}
nav button.on{color:var(--c1)}
.card{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px;margin:10px 0}
h2{font-size:12px;letter-spacing:.2em;color:var(--dim);font-weight:600;margin:18px 4px 8px;text-transform:uppercase}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--c1);color:var(--c1);background:rgba(111,243,255,.08);padding:11px 16px;border-radius:14px;font-weight:600;letter-spacing:.04em}
.btn.solid{background:linear-gradient(135deg,var(--c1),var(--c2));color:#06101a;border:0}
.btn.ghost{border-color:var(--line);color:var(--dim);background:none}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4}
input,select,textarea{font:inherit;color:var(--txt);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--c1)}
.row{display:flex;gap:8px;align-items:center}
.pill{border:1px solid var(--line);background:none;color:var(--dim);padding:6px 11px;border-radius:99px;font-size:13px}
.pill.on{border-color:var(--c2);color:var(--txt);background:rgba(138,123,255,.18)}
/* companion */
.pet{position:relative;display:flex;flex-direction:column;align-items:center;padding:6px 0 0}
.bubble{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:16px;padding:9px 14px;font-size:14px;max-width:88%;text-align:center;min-height:38px;margin-bottom:8px;position:relative}
.bubble:after{content:"";position:absolute;bottom:-6px;left:50%;width:10px;height:10px;background:#1a1f31;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.petwrap{position:relative;width:150px;height:150px;touch-action:manipulation}
.petwrap svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 18px rgba(138,123,255,.45))}
.petwrap .body{transform-origin:60px 110px;animation:float 3.2s ease-in-out infinite}
.petwrap .eyes{transform-origin:60px 58px;animation:blink 4.5s infinite}
.petwrap .antenna{animation:glow 2s ease-in-out infinite}
.m-excited .body{animation:hop .55s ease-in-out infinite}
.m-love .body{animation:sway 2.6s ease-in-out infinite}
.m-sleepy .body{animation:breathe 4.2s ease-in-out infinite}
.m-focus .body{animation:breathe 5.5s ease-in-out infinite}
.m-worried .body{animation:shiver .35s linear infinite}
.m-sad .body{animation:droop 3.6s ease-in-out infinite}
.m-surprised .body{animation:jolt .55s ease-out}
@keyframes float{50%{transform:translateY(-6px) scale(1.02,.98)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.04,.94)}50%{transform:translateY(-14px) scale(.96,1.05)}}
@keyframes sway{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-4px)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
@keyframes shiver{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
@keyframes droop{0%,100%{transform:scale(1,.97)}50%{transform:scale(1.01,.94) translateY(2px)}}
@keyframes jolt{0%{transform:scale(1.15,.82)}35%{transform:scale(.9,1.14) translateY(-14px)}100%{transform:none}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes glow{50%{opacity:.4}}
/* xp bar */
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c2));border-radius:9px;transition:width .5s}
/* date strip + calendar */
.dayhead{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 6px}
.dayhead b{font-size:20px;font-weight:600;letter-spacing:.02em}
.dayhead small{display:block;color:var(--dim);font-size:12px;letter-spacing:.06em;margin-top:2px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.day{flex:none;width:52px;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--dim)}
.day small{font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.day b{font-size:17px;font-weight:600;color:var(--txt)}
.day i{height:5px;width:5px;border-radius:9px;background:transparent}
.day i.has{background:var(--c1)}
.day.today{border-color:rgba(111,243,255,.5)}
.day.on{background:linear-gradient(160deg,rgba(111,243,255,.22),rgba(138,123,255,.28));border-color:var(--c2);color:var(--txt)}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cgrid.dow span{font-size:11px;color:var(--dim);padding:4px 0}
.cd{aspect-ratio:1;border:1px solid transparent;border-radius:12px;background:none;color:var(--txt);position:relative;font-size:14px;padding:0}
.cd.past{color:var(--dim);opacity:.55}
.cd.today{border-color:var(--c1)}
.cd.on{background:rgba(138,123,255,.32);border-color:var(--c2)}
.cd i{position:absolute;bottom:4px;left:50%;width:5px;height:5px;border-radius:9px;background:var(--c1);transform:translateX(-50%)}
/* tasks */
.task{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;margin:8px 0}
.task.done{opacity:.45}.task.done .tt{text-decoration:line-through}
.chk{width:26px;height:26px;border-radius:9px;border:1.5px solid var(--c1);background:none;flex:none;color:var(--c1);font-size:15px;display:grid;place-items:center;padding:0}
.chk.lock{border-color:var(--line);font-size:13px}
.task.done .chk{background:var(--c1);color:#06101a}
.tt{flex:1;min-width:0}.tt div:first-child{overflow:hidden;text-overflow:ellipsis}
.tt small{color:var(--dim);font-size:12px}
.go{border:1px solid var(--c2);color:var(--c2);background:none;border-radius:11px;padding:7px 11px;font-size:12px;letter-spacing:.05em;white-space:nowrap}
.x{background:none;border:0;color:var(--dim);font-size:18px;padding:4px 6px}
.empty{text-align:center;color:var(--dim);padding:22px 10px;font-size:14px}
.banner{border:1px solid var(--gold);background:rgba(255,209,102,.08);border-radius:16px;padding:12px 14px;margin:10px 0;display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:14px}
/* timer + orb */
.orbwrap{position:relative;width:min(300px,100%);aspect-ratio:1;margin:6px auto 2px}
.orbwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.bigtm{font-size:48px;font-weight:200;letter-spacing:.05em;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:6px}
.fsub{font-size:11px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase;margin-top:2px}
.fstask{font-size:16px;opacity:.9;margin-top:4px;text-align:center}
.fsf{position:fixed;inset:0;z-index:40;background:#05060d;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);overflow:hidden;text-align:center}
.fsf .fstop{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px}
.fsf .fsmid{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0}
.fsf .orbwrap{width:min(92vw,50vh);margin:0}
.fsf .bigtm{font-size:60px}
.fsf .fsbot{width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;gap:2px;max-height:44vh;overflow-y:auto}
.fsf .fsbot .card{text-align:left;width:100%}
.opts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.pdot{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0}
.pdot.on{border-color:#fff}
/* loot */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{aspect-ratio:1;border:1px solid var(--line);border-radius:14px;display:grid;place-items:center;font-size:28px;background:var(--card);position:relative}
.cell.lock{opacity:.3;filter:grayscale(1)}
.cell.r1{border-color:rgba(111,243,255,.4)}.cell.r2{border-color:rgba(138,123,255,.7)}.cell.r3{border-color:var(--gold);box-shadow:0 0 14px rgba(255,209,102,.3)}
.cell small{position:absolute;right:5px;bottom:2px;font-size:10px;color:var(--dim)}
.stat{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px;gap:10px}.stat:last-child{border:0}.stat span:first-child{color:var(--dim)}
.charpick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 2px}
.charpick button{min-width:0;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:8px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--dim)}
.charpick button.on{border-color:var(--c2);background:rgba(138,123,255,.18);color:var(--txt)}
.charpick svg{width:56px;height:56px;overflow:visible}
/* modal */
#modal{position:fixed;inset:0;background:rgba(3,5,12,.78);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#modal.show{display:flex}
.sheet{background:#10152a;border:1px solid var(--line);border-radius:22px;padding:22px;width:100%;max-width:360px;text-align:center;animation:pop .3s;max-height:90vh;overflow:auto}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.big{font-size:64px;margin:6px 0}
.sheet h3{margin:4px 0 6px;letter-spacing:.08em}
.sheet p{color:var(--dim);margin:4px 0 14px;font-size:14px}
canvas.scratch{border-radius:16px;touch-action:none;display:block;margin:10px auto;border:1px solid var(--line)}
.prize{position:relative;width:260px;height:150px;margin:10px auto;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.prize .big{margin:0;font-size:52px}
.prizewrap{position:relative;width:260px;height:150px;margin:10px auto}
.prizewrap canvas{position:absolute;inset:0;margin:0}
.arow{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px}
.arow input{width:20px;height:20px;flex:none}
.ai{width:30px;height:30px;border-radius:9px;background:rgba(138,123,255,.25);display:grid;place-items:center;font-weight:700;flex:none}
.arow.dn span:last-child{opacity:.5;text-decoration:line-through}
.arow input:disabled{opacity:.5}
.tag{font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);margin-right:6px;white-space:nowrap}
.tag.t-office{color:var(--c1);border-color:rgba(111,243,255,.4)}
.tag.t-home{color:var(--gold);border-color:rgba(255,209,102,.4)}
.tag.t-fun{color:var(--pink);border-color:rgba(255,122,217,.4)}
#toast{position:fixed;top:calc(var(--sat) + 10px);left:50%;transform:translate(-50%,-120px);background:#151b33;border:1px solid var(--c2);padding:10px 16px;border-radius:14px;z-index:60;transition:transform .35s;font-size:14px;max-width:90%;text-align:center}
#toast.show{transform:translate(-50%,0)}
.conf{position:fixed;top:-30px;font-size:22px;z-index:70;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
.flame{color:var(--gold)}
.mini{font-size:12px;color:var(--dim)}
.ms{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ms span{font-size:12px;padding:4px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
.ms span.got{border-color:var(--gold);color:var(--gold)}
.credit{text-align:center;margin:22px 0 6px;font-size:12px;color:var(--dim);letter-spacing:.06em}
.credit b{color:var(--c1);font-weight:600}
ol.steps{text-align:left;color:var(--txt);font-size:14px;padding-left:20px;margin:8px 0 14px;line-height:1.5}
ol.steps li{margin:6px 0}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">NUDGE</div>
    <div class="chips">
      <div class="chip flame" id="chStreak">🔥 0</div>
      <div class="chip" id="chCoins">🪙 0</div>
    </div>
  </header>
  <main id="main"></main>
  <nav id="nav">
    <button data-t="today" class="on"><b>▣</b>PLAN</button>
    <button data-t="focus"><b>◔</b>FOCUS</button>
    <button data-t="loot"><b>✦</b>LOOT</button>
    <button data-t="me"><b>◍</b>ME</button>
  </nav>
</div>
<div id="modal"></div>
<div id="toast"></div>

<script>
'use strict';
const UI_V=8;
const UPDATE_URL='https://raw.githubusercontent.com/unmeshkhare/nudge/main/www/app.html';
const CHARS={
  pip:{n:'Pip',a:'#9ff6ff',b:'#7a63ff',acc:'#6ff3ff',cheek:'#ff7ad9',glow:'rgba(138,123,255,.45)',kind:'antenna'},
  rosy:{n:'Rosy',a:'#ffd3ec',b:'#ff6fae',acc:'#ffd166',cheek:'#ff4f8b',glow:'rgba(255,111,174,.42)',kind:'ears'},
  mint:{n:'Mint',a:'#c8ffe2',b:'#22c79d',acc:'#eaff7a',cheek:'#ff9ab8',glow:'rgba(34,199,157,.42)',kind:'leaf'},
  kage:{n:'Kage',a:'#5b6388',b:'#1d2140',acc:'#ff4d4d',cheek:'#1d2140',glow:'rgba(255,77,77,.35)',kind:'ninja',nocheek:1,brow:1},
  volt:{n:'Volt',a:'#eef4fb',b:'#6d86a8',acc:'#ffd166',cheek:'#6d86a8',glow:'rgba(109,134,168,.5)',kind:'robot',shape:'square',nocheek:1,brow:1},
  fang:{n:'Fang',a:'#d7deee',b:'#5b6b8c',acc:'#eef2fb',cheek:'#5b6b8c',glow:'rgba(91,107,140,.45)',kind:'wolf',nocheek:1,brow:1}
};
const MOODS=['happy','excited','love','sleepy','focus','worried','sad','surprised'];
let _gid=0;
function pipSVG(ch,mood,o){
  o=o||{};
  const C=CHARS[ch]||CHARS.pip;
  const m=MOODS.indexOf(mood)<0?'happy':mood;
  const gid='pg'+(++_gid);
  const ink='#0a0e1a';
  const cheeks=a=>C.nocheek?'':`<circle cx="33" cy="72" r="6" fill="${C.cheek}" opacity="${a}"/><circle cx="87" cy="72" r="6" fill="${C.cheek}" opacity="${a}"/>`;
  const eyes=(rx,ry,dy)=>{dy=dy||0;return `<g class="eyes"><ellipse cx="44" cy="${58+dy}" rx="${rx}" ry="${ry}" fill="${ink}"/><ellipse cx="76" cy="${58+dy}" rx="${rx}" ry="${ry}" fill="${ink}"/><circle cx="46.2" cy="${54.6+dy}" r="2.5" fill="#fff"/><circle cx="78.2" cy="${54.6+dy}" r="2.5" fill="#fff"/></g>`};
  const heart=cx=>`<path d="M${cx} 65C${cx-9} 58 ${cx-10} 51 ${cx-5} 49.5C${cx-2} 48.5 ${cx} 50.5 ${cx} 52C${cx} 50.5 ${cx+2} 48.5 ${cx+5} 49.5C${cx+10} 51 ${cx+9} 58 ${cx} 65z" fill="#ff3d7f"/><circle cx="${cx-3.5}" cy="53" r="1.7" fill="#fff" opacity=".85"/>`;
  const brows=`<path d="M36 49L50 44.5M70 44.5L84 49" stroke="${ink}" stroke-width="3" stroke-linecap="round" fill="none"/>`;
  let face='';
  if(m==='happy'){
    face=eyes(6.5,8.5)+cheeks(.45)+`<path d="M50 72q10 11 20 0" stroke="${ink}" stroke-width="3.5" stroke-linecap="round" fill="none"/>`;
  }else if(m==='excited'){
    face=eyes(7.6,10.2)+`<circle cx="41.5" cy="60" r="1.6" fill="#fff" opacity=".8"/><circle cx="73.5" cy="60" r="1.6" fill="#fff" opacity=".8"/>`+cheeks(.65)+`<path d="M46.5 69q13.5 21 27 0z" fill="${ink}"/><path d="M52.5 77.5q7.5 6.5 15 0q-7.5-4.5-15 0z" fill="#ff6f9a"/>`;
  }else if(m==='love'){
    face=heart(44)+heart(76)+cheeks(.7)+`<path d="M50 73q10 10 20 0" stroke="${ink}" stroke-width="3.5" stroke-linecap="round" fill="none"/>`;
  }else if(m==='sleepy'){
    face=`<path d="M37.5 59q6.5 6.5 13 0M69.5 59q6.5 6.5 13 0" stroke="${ink}" stroke-width="3.6" stroke-linecap="round" fill="none"/>`+cheeks(.35)+`<ellipse cx="60" cy="75" rx="3.2" ry="3.8" fill="${ink}" opacity=".85"/>`;
  }else if(m==='focus'){
    face=`<path d="M37.5 61q6.5-6.5 13 0M69.5 61q6.5-6.5 13 0" stroke="${ink}" stroke-width="3.6" stroke-linecap="round" fill="none"/>`+cheeks(.4)+`<path d="M53.5 74q6.5 5.5 13 0" stroke="${ink}" stroke-width="3.2" stroke-linecap="round" fill="none"/>`;
  }else if(m==='worried'){
    face=eyes(5.6,7.2,1)+brows+`<path d="M50.5 77.5q4.75-5 9.5 0q4.75 5 9.5 0" stroke="${ink}" stroke-width="3.2" stroke-linecap="round" fill="none"/>`+`<path d="M97 39q6 9 0 12.5q-6-3.5 0-12.5z" fill="#9fdcff" opacity=".95"/>`;
  }else if(m==='sad'){
    face=eyes(6.8,8.6,3)+`<circle cx="46.4" cy="57.2" r="3" fill="#fff"/><circle cx="78.4" cy="57.2" r="3" fill="#fff"/>`+brows+`<path d="M49 80q11-10 22 0" stroke="${ink}" stroke-width="3.5" stroke-linecap="round" fill="none"/>`+`<path d="M39.5 69q4.5 7.5 0 10q-4.5-2.5 0-10z" fill="#9fdcff"/>`;
  }else{ // surprised
    face=`<g class="eyes"><circle cx="44" cy="58" r="8" fill="#fff" stroke="${ink}" stroke-width="2.6"/><circle cx="76" cy="58" r="8" fill="#fff" stroke="${ink}" stroke-width="2.6"/><circle cx="44" cy="59" r="3.2" fill="${ink}"/><circle cx="76" cy="59" r="3.2" fill="${ink}"/></g>`+`<path d="M35 44q9-6 18 0M67 44q9-6 18 0" stroke="${ink}" stroke-width="2.8" stroke-linecap="round" fill="none"/>`+cheeks(.5)+`<ellipse cx="60" cy="77" rx="5.2" ry="7" fill="${ink}"/>`;
  }
  if(C.brow&&['happy','excited','love','sleepy','focus'].indexOf(m)>=0)face+=`<path d="M33 43L52 45.5M68 45.5L87 43" stroke="${ink}" stroke-width="4.6" stroke-linecap="round" fill="none"/>`;
  const SQ=C.shape==='square';
  const BODY=SQ?'M28 14h64q16 0 16 16v62q0 16-16 16H28q-16 0-16-16V30q0-16 16-16z':'M60 14c28 0 46 22 46 48s-16 46-46 46S14 88 14 62 32 14 60 14z';
  let behind='',front='',mid='';
  const mir=p=>p.replace(/(-?\d+(?:\.\d+)?) (-?\d+(?:\.\d+)?)/g,(a,x,y)=>(120-x)+' '+y);
  if(C.kind==='horns'){
    const h='M31 30C22 20 21 9 26 1C35 8 41 18 43 27z';
    behind=`<path d="${h}" fill="${C.acc}"/><path d="${mir(h)}" fill="${C.acc}"/>`;

function bumpStreak(){
  const t=today();if(S.lastActive===t)return;
  if(S.lastActive){const g=dayDiff(S.lastActive,t);
    if(g===1)S.streak++;
    else if(g===2&&S.freezes>0){S.freezes--;S.streak++;toast('🧊 Streak Freeze used — streak saved!')}
    else S.streak=1;
  }else S.streak=1;
  S.lastActive=t;S.best=Math.max(S.best,S.streak);
  if(MS.includes(S.streak)&&!S.msDone[S.streak]){
    S.msDone[S.streak]=1;S.cards+=1+(S.streak>=14?1:0);S.coins+=S.streak*3;
    const r=giveItem(S.streak>=30?3:S.streak>=14?2:1);
    modal(`<div class="big">🔥</div><h3>${S.streak}-DAY STREAK!</h3><p>Reward: ${r.it.e} ${r.it.n}, +${S.streak*3} coins and ${S.streak>=14?2:1} scratch card${S.streak>=14?'s':''}</p><button class="btn solid" data-close>Let's go</button>`,()=>render());
    say('A streak milestone! Wow!','excited',6000);
    confetti(70,['🔥','✨','🏆','⭐']);
  }
}
function completeTask(id){
  const k=S.tasks.find(x=>x.id===id);if(!k||k.done||k.date>today())return;
  k.done=true;k.doneAt=Date.now();
  const coins=3+Math.ceil(k.min/5),xp=k.min;
  const lv0=level();S.coins+=coins;S.xp+=xp;S.doneCount++;S.totalDone++;S.focusMin+=k.min;
  bumpStreak();

  if(S.doneCount>=3&&!S.questDone){S.questDone=true;S.cards++;extra.push('🎟️ Daily quest done: scratch card!')}

const ambVol=()=>(S.settings.vol==null?60:S.settings.vol)/100*.85;

function noiseBuf(c,brown){

  for(let i=0;i<len;i++){const w=Math.random()*2-1;if(brown){last=(last+.02*w)/1.02;d[i]=last*3.5}else d[i]=w}
  return b;

      o.type='sine';o.frequency.value=1300+Math.random()*2700;og.gain.setValueAtTime(.0001,t);og.gain.exponentialRampToValueAtTime(.012+Math.random()*.04,t+.004);og.gain.exponentialRampToValueAtTime(.0001,t+.06);
      o.connect(og);og.connect(g);o.start(t);o.stop(t+.08);setTimeout(drop,40+Math.random()*170)})();
  }else if(kind==='wind'){
    const n=src(noiseBuf(c,true)),bp=c.createBiquadFilter(),ng=c.createGain(),lg=c.createGain(),l2g=c.createGain();
    bp.type='bandpass';bp.frequency.value=420;bp.Q.value=.8;ng.gain.value=1.1;
    lg.gain.value=260;osc(.07,lg);lg.connect(bp.frequency);
    l2g.gain.value=.4;osc(.045,l2g);l2g.connect(ng.gain);

    const F=[220,164.81];let n=0;
    (function hit(){if(!alive)return;const f=F[n++%2],t=c.currentTime;
      [[1,.16,6],[2.71,.07,3.6],[5.12,.025,1.8]].forEach(([m,a,d])=>[0,1.4].forEach(det=>{const o=c.createOscillator(),og=c.createGain();o.frequency.value=f*m+det;og.gain.setValueAtTime(.0001,t);og.gain.exponentialRampToValueAtTime(a,t+.015);og.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(og);og.connect(bus);o.start(t);o.stop(t+d+.1)}));
      setTimeout(hit,9000+Math.random()*1500)})();
  }else if(kind==='fire'){
    const n=src(noiseBuf(c,true)),lp=c.createBiquadFilter(),ng=c.createGain(),h=src(noiseBuf(c,false)),hp=c.createBiquadFilter(),hg=c.createGain();
    lp.type='lowpass';lp.frequency.value=260;ng.gain.value=1.4;n.connect(lp);lp.connect(ng);ng.connect(g);
    hp.type='highpass';hp.frequency.value=3500;hg.gain.value=.03;h.connect(hp);hp.connect(hg);hg.connect(g);
    const nb=noiseBuf(c,false);
    (function pop(){if(!alive)return;const s=c.createBufferSource(),pg=c.createGain(),f=c.createBiquadFilter(),t=c.currentTime,d=.006+Math.random()*.02;
      s.buffer=nb;f.type='highpass';f.frequency.value=1500+Math.random()*2500;pg.gain.setValueAtTime(.05+Math.random()*.35,t);pg.gain.exponentialRampToValueAtTime(.0001,t+d);
      s.connect(f);f.connect(pg);pg.connect(g);s.start(t,Math.random()*2);s.stop(t+d+.02);setTimeout(pop,Math.random()<.2?20+Math.random()*60:90+Math.random()*420)})();

/* ============ BEAT THE CLOCK (sprint) ============ */
function startSprint(min,taskId){
  window._fsMin=false;
  if(S.timer&&!confirm('Replace the running timer?'))return;
  S.timer={kind:'sprint',total:min*60,endAt:Date.now()+min*60000,taskId:taskId||null,paused:false,remain:min*60};save();
  beep([660,880,1100],.07);say('Beat the clock! Go go go!','excited',min*60000);render();
}
function sprintWin(){
  const t=S.timer;if(!t||t.kind!=='sprint')return;
  const spare=Math.max(0,remain()),bonus=8+Math.ceil(spare/60)*3,mins=Math.round(t.total/60);
  S.timer=null;tmpMood=null;
  S.coins+=bonus;S.xp+=mins*2;S.sprints=(S.sprints||0)+1;S.pomos+=0;
  const card=Math.random()<.4;if(card)S.cards++;
  if(!t.taskId){bumpStreak();S.focusMin+=mins}
  save();head();ambSync();
  if(t.taskId)completeTask(t.taskId);
  say('BEAT THE CLOCK! ⚡','excited',4500);
  confetti(50,['⚡','✨','⭐','🔥']);beep([659,784,988,1319]);
  modal(`<div class="big">⚡</div><h3>BEAT THE CLOCK!</h3><p>${spare} sec to spare<br><b style="color:var(--gold)">+${bonus} 🪙 bonus</b>${card?' · 🎟️ scratch card!':''}</p><button class="btn solid" data-close>Nice</button>`,()=>render());
  render();
}

/* ============ SURPRISE ME ============ */
function openSurprise(){
  const t=today();
  const pool=()=>S.tasks.filter(k=>k.date===t&&!k.done&&catOf(k)!=='fun');
  if(!pool().length){toast('Add an Office or Home task first 🎲');return}
  let rerolls=1,cur=null,busy=false;
  modal(`<h3>🎲 SURPRISE ME</h3><div class="big" id="spE" style="margin:2px 0">🎰</div>
   <div id="spT" style="font-size:20px;font-weight:600;min-height:56px;display:flex;align-items:center;justify-content:center;line-height:1.25"></div>
   <div id="spM" class="mini" style="min-height:34px"></div>
   <div class="row" style="justify-content:center;flex-wrap:wrap;margin-top:12px"><button class="btn solid" id="spGo" disabled>Do it!</button><button class="btn" id="spRe" disabled>🔄 Re-roll</button></div>
   <button class="btn ghost" data-close style="margin-top:10px">Not now</button>`,()=>render(),el=>{
    const T=el.querySelector('#spT'),M=el.querySelector('#spM'),E=el.querySelector('#spE'),go=el.querySelector('#spGo'),re=el.querySelector('#spRe');
    const spin=()=>{
      const p=pool();if(!p.length){el._close();return}
      busy=true;go.disabled=re.disabled=true;M.textContent='';E.textContent='🎰';
      const total=14+Math.floor(Math.random()*6);let n=0;
      const step=()=>{
        if(!el.isConnected)return;
        n++;
        if(n<total){T.textContent=rnd(p).title;beep([300+Math.random()*500],.03);setTimeout(step,55+n*13);return}
        let c=rnd(p);if(cur&&p.length>1){let g=0;while(c.id===cur.id&&g++<20)c=rnd(p)}
        cur=c;busy=false;
        const cat=CAT[catOf(c)]||CAT.office;
        E.textContent=cat.e;T.innerHTML=esc(c.title);
        M.textContent=(c.nt?'No timer — just do it':c.min+' min')+' · finish it for a bonus 🎁';
        confetti(12,['✨','🎲','⭐']);beep([523,659,784],.08);
        go.disabled=false;re.disabled=rerolls<=0||p.length<2;re.textContent='🔄 Re-roll ('+rerolls+')';
      };
      step();
    };
    re.onclick=()=>{if(busy||rerolls<=0)return;rerolls--;spin()};
    go.onclick=()=>{
      if(busy||!cur)return;const k=S.tasks.find(x=>x.id===cur.id);if(!k)return;
      if(!k.nt&&S.timer&&!confirm('Replace the running timer?'))return;
      k.sup=true;save();el._close();
      say(`Let's go: "${k.title}"!`,'excited',3000);
      if(!k.nt){startTimer('focus',k.min,k.id);tab='focus';render()}else toast('Go! Tick it off when done 🎁');
    };
    spin();
  });
}

/* ============ UPDATES (live UI updates, data untouched) ============ */
function otaPending(){try{const c=JSON.parse(localStorage.getItem('nudge.ota')||'null');return c&&c.v>UI_V?c.v:0}catch(e){return 0}}
async function checkUpdate(manual){
  const base=S.settings.updateUrl||UPDATE_URL;
  try{
    const r=await fetch(base+(base.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error(r.status===404?'repo is private or file missing':'HTTP '+r.status);
    const html=await r.text();
    const m=/name="nudge-ui" content="(\d+)"/.exec(html);
    if(!m||!/<\/html>\s*$/i.test(html))throw new Error('not a Nudge page');
    const v=+m[1];S.lastCheck=Date.now();save();
    const bad=+(localStorage.getItem('nudge.bad')||0);
    if(v>UI_V&&(manual||v!==bad)&&v>otaPending()){
      localStorage.setItem('nudge.ota',JSON.stringify({v,html}));if(bad===v)localStorage.removeItem('nudge.bad');
      toast('✨ Update ready — tap Apply');render();
    }else if(manual)toast(v>UI_V?'Update already downloaded — tap Apply':'You have the latest version ✅');
    return true;
  }catch(e){if(manual)toast('Could not check: '+(e.message||'offline'));return false}
}

  let ctrl;
  if(t){ctrl=t.kind==='sprint'
    ?`<div class="row" style="justify-content:center;flex-wrap:wrap"><button class="btn solid" id="spw">⚡ DONE IN TIME!</button><button class="btn ghost" id="stp">GIVE UP</button></div>`
    :`<div class="row" style="justify-content:center;flex-wrap:wrap"><button class="btn" id="pz">${t.paused?'RESUME':'PAUSE'}</button>${t.kind==='focus'?`<button class="btn solid" id="fin">✓ ${t.taskId?'FINISHED THE TASK':'FINISH NOW'}</button><button class="btn ghost" id="stp">STOP</button>`:`<button class="btn ghost" id="eb">END BREAK</button>`}</div>`}
  else{
    ctrl=`<select id="fsel"><option value="">Free focus (no task)</option>${open.map(x=>`<option value="${x.id}" ${x.id===fs?'selected':''}>${(CAT[catOf(x)]||CAT.office).e} ${esc(x.title)} · ${x.min}m</option>`).join('')}</select>
    ${k?'':`<div class="row" style="justify-content:center;margin-top:10px;flex-wrap:wrap">${[10,15,25,45,50].map(m=>`<button class="pill ${(window._fm||25)===m?'on':''}" data-fm="${m}">${m}m</button>`).join('')}</div>`}
    <div class="row" style="justify-content:center;margin-top:14px"><button class="btn solid" id="st" style="padding:13px 34px">START FOCUS</button><button class="btn ghost" id="sb">${S.settings.brk}m BREAK</button></div>`;
  }
  const label=t?(t.kind==='focus'?(t.taskId?'FOCUS · task':'FOCUS'):(t.kind==='sprint'?'SPRINT ⚡':'BREAK')):'READY';
  const shown=t?r:(k?k.min:(window._fm||25))*60;
  const allOpen=S.tasks.filter(x=>x.date===today()&&!x.done);
  const sprintCard=t?'':`<div class="card"><b>⚡ Beat the clock</b>
   <div class="mini" style="margin:6px 0 10px">Pick a task (or type a tiny one) and finish before time runs out for a bonus.</div>
   <select id="ssel"><option value="">Free sprint (no task)</option>${allOpen.map(x=>`<option value="${x.id}" ${x.id===window._ssel?'selected':''}>${(CAT[catOf(x)]||CAT.office).e} ${esc(x.title)}</option>`).join('')}</select>
   <input id="stn" placeholder="…or type a tiny task" style="margin-top:8px" autocomplete="off">
   <div class="row" style="justify-content:center;margin-top:10px">${[5,10,15].map(m=>`<button class="pill ${(window._sm||10)===m?'on':''}" data-sm="${m}">${m} min</button>`).join('')}</div>
   <div class="row" style="justify-content:center;margin-top:12px"><button class="btn solid" id="sps">⚡ START SPRINT</button></div></div>`;
  const soundCard=`<div class="card"><b>🎧 Focus sound</b>
   <div class="opts">${SND.map(o=>`<button class="pill ${(S.settings.snd||'off')===o[0]?'on':''}" data-snd="${o[0]}">${o[1]} ${o[2]}</button>`).join('')}</div>
   <div class="row" style="margin-top:4px"><span class="mini">Volume</span><input type="range" id="vol" min="0" max="100" value="${S.settings.vol==null?60:S.settings.vol}" style="padding:0;border:0;background:none"></div>
   <div class="mini" style="margin-top:6px">Plays while a focus or sprint timer runs. “Match orb” picks the sound that fits your orb. Made on the phone, nothing downloaded.</div></div>`;
  const brk=(t&&t.kind==='break')?`<div class="card"><b>☕ Break quick wins</b>${breakListHTML()||'<div class="mini" style="margin-top:6px">No Home or Fun tasks left today — just enjoy the break 🌿</div>'}</div>`:'';
  const tk=t&&t.taskId?S.tasks.find(x=>x.id===t.taskId):null;
  const tmr=`<div class="bigtm" id="tmr">${pad(Math.floor(shown/60))}:${pad(shown%60)}</div><div class="fsub">${label} · ${S.pomos} pomodoros</div>${tk?`<div class="fstask">${esc(tk.title)}</div>`:''}`;
  if(t&&!window._fsMin){
    const cur=SND.find(o=>o[0]===(S.settings.snd||'off'))||SND[0];
    return `<div class="fsf"><div class="fstop"><button class="btn ghost" id="fsmin">⌄ Minimize</button><button class="btn ghost" id="fssnd">${cur[1]} ${cur[2]}</button></div>
     <div class="fsmid"><div class="orbwrap"><canvas id="orb"></canvas></div></div>
     <div class="fsbot">${tmr}<div style="margin-top:8px">${ctrl}</div>${brk}</div></div>`;
  }
  return `<div class="card" style="text-align:center">
   <div class="orbwrap"><canvas id="orb"></canvas></div>
   ${tmr}
   <div class="opts" style="margin-top:12px">${OrbKit.IDS.map(o=>`<button class="pill ${orbId()===o[0]?'on':''}" data-os="${o[0]}">${o[1]}</button>`).join('')}</div>
   <div style="margin-top:12px">${ctrl}${t?'<div style="margin-top:10px"><button class="btn ghost" id="fsfull">⛶ Full screen</button></div>':''}</div></div>
   ${brk}${sprintCard}${soundCard}
   <div class="card mini">Finish a focus session on a task and it's auto-completed with rewards. Done early? Tap FINISH to complete it right away. Tasks marked "no timer" are ticked off from the Plan tab.</div>`;
}
function viewLoot(){
  const own=ITEMS.filter(i=>S.items[i.id]).length;
  const nxt=MS.find(m=>!S.msDone[m]);
  return `<div class="card" style="text-align:center">
   <div class="row" style="justify-content:space-around">
    <div><div class="big" style="font-size:42px">🎟️</div><div><b>${S.cards}</b> scratch card${S.cards===1?'':'s'}</div><button class="btn solid" id="sc" style="margin-top:8px" ${S.cards?'':'disabled'}>SCRATCH</button></div>
    <div><div class="big" style="font-size:42px">🥚</div><div>Mystery egg</div><button class="btn" id="egg" style="margin-top:8px" ${S.coins>=30?'':'disabled'}>30 🪙 OPEN</button></div>
   </div>
   <div class="mini" style="margin-top:12px">Cards drop from: 3 tasks/day · perfect days · streak milestones · random surprises</div></div>
  <h2>Streak milestones</h2><div class="card"><div class="ms">${MS.map(m=>`<span class="${S.msDone[m]?'got':''}">${m}d ${S.msDone[m]?'✓':''}</span>`).join('')}</div>
   <div class="mini" style="margin-top:8px">${nxt?`Next: ${nxt}-day streak (you're at ${streakAlive()})`:'All milestones done!'}</div></div>
  <h2>Collection · ${own}/${ITEMS.length}</h2>
  <div class="grid">${ITEMS.map(i=>{const c=S.items[i.id];return `<div class="cell r${i.r} ${c?'':'lock'}">${c?i.e:'?'}${c>1?`<small>×${c}</small>`:''}</div>`}).join('')}</div>`;
}
function viewMe(){
  const sa=streakAlive();
  const lc=S.lastCheck?new Date(S.lastCheck).toLocaleString():'never';
  return banner()+`<div class="card">
   <div class="stat"><span>Level</span><span>${level()} · ${S.xp} XP</span></div>
   <div class="stat"><span>Current streak</span><span>🔥 ${sa} days</span></div>
   <div class="stat"><span>Best streak</span><span>${S.best} days</span></div>
   <div class="stat"><span>Tasks completed</span><span>${S.totalDone}</span></div>
   <div class="stat"><span>Focused minutes</span><span>${S.focusMin}</span></div>
   <div class="stat"><span>Pomodoros</span><span>${S.pomos}</span></div>
   <div class="stat"><span>Sprints won</span><span>⚡ ${S.sprints||0}</span></div>
   <div class="stat"><span>Streak freezes</span><span>🧊 ${S.freezes}</span></div></div>
  <h2>Companion</h2><div class="card"><div class="charpick">${Object.keys(CHARS).map(c=>`<button class="${S.settings.char===c?'on':''}" data-ch="${c}">${pipSVG(c,'happy')}<span>${CHARS[c].n}</span></button>`).join('')}</div>
   <div class="mini" style="text-align:center;margin-top:6px">Tap to switch — it changes on the widget too.</div></div>
  <h2>Settings</h2><div class="card">
   <div class="stat"><span>Default task length</span><span><input type="number" id="sdef" min="1" max="240" value="${S.settings.def}" style="width:80px;padding:7px"></span></div>
   <div class="stat"><span>Break length</span><span><input type="number" id="sbrk" min="1" max="60" value="${S.settings.brk}" style="width:80px;padding:7px"></span></div>
   <div class="stat"><span>Daily nudge time</span><span><input type="time" id="sdaily" value="${S.settings.daily}" style="width:120px;padding:7px"></span></div>
   <div class="stat"><span>Sounds</span><span><button class="pill ${S.settings.sound?'on':''}" id="ssound">${S.settings.sound?'ON':'OFF'}</button></span></div>
   <div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="btn" id="nt">Enable reminders</button><button class="btn ghost" id="tn">Test</button></div></div>
  <h2>Updates</h2><div class="card">
   <div class="stat"><span>App version</span><span id="ver">UI v${UI_V}</span></div>
   <div class="stat"><span>Last checked</span><span style="font-size:12px">${esc(lc)}</span></div>
   <div class="mini" style="margin:8px 0">New looks and features download automatically and keep all your data.</div>
   <button class="btn" id="cu">Check for updates</button></div>
  <h2>Data</h2><div class="card"><div class="row" style="flex-wrap:wrap">
   <button class="btn ghost" id="bcopy">Copy backup</button>${NN?'<button class="btn ghost" id="bshare">Share backup</button>':'<button class="btn ghost" id="exp">Export file</button>'}<button class="btn ghost" id="brest">Restore</button><button class="btn ghost" id="rst" style="color:#ff7a7a;border-color:#5a2a2a">Reset</button></div>
   <div class="mini" style="margin-top:8px">Everything is stored only on this phone. A backup is a block of text you can save in Notes or send to yourself.</div></div>
  <h2>About</h2><div class="card" style="text-align:center"><div style="font-size:15px">This app is made by</div><div style="font-size:22px;font-weight:700;color:var(--c1);margin:4px 0">Unmesh Khare</div><div class="mini">Graviton · Nudge with ${esc(charName())} 💜</div></div>`;
}
function render(){
  rollover();head();
  const m=$('#main'),sc=m.scrollTop;
  m.innerHTML=({today:viewToday,focus:viewFocus,loot:viewLoot,me:viewMe})[tab]();
  m.scrollTop=sc;bind();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  ambSync();
}
function openCalendar(){
  let d=parseD(sel),y=d.getFullYear(),mo=d.getMonth();
  modal('<div id="calbox"></div>',()=>render(),el=>{
    const box=el.querySelector('#calbox');
    const draw=()=>{
      const first=new Date(y,mo,1),sd=(first.getDay()+6)%7,dim=new Date(y,mo+1,0).getDate(),t=today();
      const cnt={};S.tasks.forEach(k=>{if(!k.done)cnt[k.date]=(cnt[k.date]||0)+1});
      let cells='';for(let i=0;i<sd;i++)cells+='<span></span>';
      for(let day=1;day<=dim;day++){const s=y+'-'+pad(mo+1)+'-'+pad(day);cells+=`<button class="cd ${s===sel?'on':''} ${s===t?'today':''} ${s<t?'past':''}" data-d="${s}">${day}${cnt[s]?'<i></i>':''}</button>`}
      box.innerHTML=`<div class="row" style="justify-content:space-between"><button class="x" id="pm" style="font-size:24px">‹</button><b>${esc(first.toLocaleDateString(undefined,{month:'long',year:'numeric'}))}</b><button class="x" id="nm" style="font-size:24px">›</button></div>
       <div class="cgrid dow">${['M','T','W','T','F','S','S'].map(x=>`<span>${x}</span>`).join('')}</div><div class="cgrid">${cells}</div>
       <div class="mini" style="margin-top:10px">Dots = days with tasks</div>
       <div class="row" style="justify-content:center;margin-top:12px"><button class="btn" id="ct">Today</button><button class="btn ghost" id="cc">Close</button></div>`;
      box.querySelector('#pm').onclick=()=>{mo--;if(mo<0){mo=11;y--}draw()};
      box.querySelector('#nm').onclick=()=>{mo++;if(mo>11){mo=0;y++}draw()};
      box.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{sel=b.dataset.d;el._close()});
      box.querySelector('#ct').onclick=()=>{sel=today();el._close()};
      box.querySelector('#cc').onclick=()=>el._close();
    };
    draw();
  },true);
}
function bind(){
  const q=(s,f)=>document.querySelectorAll(s).forEach(f);
  const au=$('#applyUp');if(au)au.onclick=()=>location.reload();
  if(tab==='today'){bindPet();
    q('[data-day]',b=>b.onclick=()=>{sel=b.dataset.day;render()});
    $('#calb').onclick=openCalendar;
    const st=$('#strip'),on=st&&st.querySelector('.on');if(on)st.scrollLeft=on.offsetLeft-st.clientWidth/2+on.clientWidth/2;
    q('[data-cf]',b=>b.onclick=()=>{window._cf=b.dataset.cf;render()});
    q('[data-c]',b=>b.onclick=()=>{const k=S.tasks.find(x=>x.id===b.dataset.c);if(k&&!k.done)completeTask(k.id)});
    q('[data-more]',b=>b.onclick=()=>openTaskSheet(b.dataset.more));
    q('[data-mv]',b=>b.onclick=()=>{if(moveTask(b.dataset.mv,today())){sel=today();render()}});
    q('[data-s]',b=>b.onclick=()=>{const k=S.tasks.find(x=>x.id===b.dataset.s);if(!k)return;if(S.timer&&!confirm('Replace the running timer?'))return;startTimer('focus',k.min,k.id);tab='focus';render()});
    q('[data-m]',b=>b.onclick=()=>{window._m=+b.dataset.m;q('[data-m]',x=>x.classList.toggle('on',x===b))});
    const bindTpl=()=>q('[data-tpl]',b=>b.onclick=()=>{addTasks(b.dataset.tpl,window._m,'',sel,window._cat||'office',!!window._nt);render()});
    bindTpl();
    q('[data-cat]',b=>b.onclick=()=>{window._cat=b.dataset.cat;q('[data-cat]',x=>x.classList.toggle('on',x===b));const tp=$('#tpls');if(tp){tp.innerHTML=TPL[window._cat].map(x=>`<button class="pill" data-tpl="${esc(x)}">+ ${esc(x)}</button>`).join('');bindTpl()}});
    const nb=$('#ntb');if(nb)nb.onclick=()=>{window._nt=!window._nt;nb.classList.toggle('on',window._nt);nb.textContent=window._nt?'✓ No timer':'⏱ With timer'};
    const add=$('#add');
    if(add){
      const go=()=>{const i=$('#ti');if(!i.value.trim()){i.focus();return}addTasks(i.value,window._m,$('#ta').value,sel,window._cat||'office',!!window._nt);render()};
      add.onclick=go;$('#ti').onkeydown=e=>{if(e.key==='Enter')go()};
    }
    const su=$('#surp');if(su)su.onclick=openSurprise;
    q('[data-r]',b=>b.onchange=()=>toggleRoutine(b.dataset.r,b.dataset.i,b.checked));
    const re=$('#redit');if(re)re.onclick=openRoutineEdit;
  }
  if(tab==='focus'){
    startOrb();
    q('[data-os]',b=>b.onclick=()=>{S.settings.orb=b.dataset.os;save();render()});
    const f=$('#fsel');if(f)f.onchange=()=>{window._fsel=f.value;render()};
    q('[data-fm]',b=>b.onclick=()=>{window._fm=+b.dataset.fm;render()});
    const st=$('#st');if(st)st.onclick=()=>{const k=S.tasks.find(x=>x.id===window._fsel);startTimer('focus',k?k.min:(window._fm||25),k?k.id:null)};
    const sb=$('#sb');if(sb)sb.onclick=()=>startTimer('break',S.settings.brk);
    const pz=$('#pz');if(pz)pz.onclick=()=>{const t=S.timer;if(t.paused){t.endAt=Date.now()+t.remain*1000;t.paused=false}else{t.remain=remain();t.paused=true}save();render()};
    const fin=$('#fin');if(fin)fin.onclick=()=>finishTimer(true);
    const fm=$('#fsmin');if(fm)fm.onclick=()=>{window._fsMin=true;render()};
    const ff=$('#fsfull');if(ff)ff.onclick=()=>{window._fsMin=false;render()};
    const fsn=$('#fssnd');if(fsn)fsn.onclick=()=>{const ids=SND.map(o=>o[0]),i=ids.indexOf(S.settings.snd||'off');S.settings.snd=ids[(i+1)%ids.length];save();render()};
    const eb=$('#eb');if(eb)eb.onclick=()=>{S.timer=null;save();render()};
    const sp=$('#stp');if(sp)sp.onclick=()=>{if(confirm(S.timer&&S.timer.kind==='sprint'?'Give up this sprint? No bonus.':'Stop without finishing? No reward. (Tap FINISH to complete it early instead.)')){S.timer=null;save();render()}};
    bindBreakList(document);
    q('[data-snd]',b=>b.onclick=()=>{S.settings.snd=b.dataset.snd;save();if(!S.timer&&b.dataset.snd!=='off'){AMB.prev=Date.now()+6000;setTimeout(ambSync,6100)}else AMB.prev=0;render()});
    const vol=$('#vol');if(vol)vol.oninput=()=>{S.settings.vol=+vol.value;if(AMB.master)AMB.master.gain.value=ambVol()};
    if(vol)vol.onchange=()=>save();
    const ss=$('#ssel');if(ss)ss.onchange=()=>{window._ssel=ss.value};
    q('[data-sm]',b=>b.onclick=()=>{window._sm=+b.dataset.sm;q('[data-sm]',x=>x.classList.toggle('on',x===b))});
    const sps=$('#sps');if(sps)sps.onclick=()=>{
      let id=($('#ssel').value)||null;const nm=($('#stn').value||'').trim(),m=window._sm||10;
      if(nm){const k={id:uid(),title:nm,min:m,date:today(),done:false,at:'',notified:false,cat:window._cat||'office',nt:false};S.tasks.push(k);id=k.id;save()}
      startSprint(m,id)};
    const spw=$('#spw');if(spw)spw.onclick=sprintWin;
  }
  if(tab==='loot'){$('#sc').onclick=openScratch;$('#egg').onclick=openEgg}
  if(tab==='me'){
    const num=(id,key,min,max)=>$(id).onchange=e=>{S.settings[key]=Math.min(max,Math.max(min,+e.target.value||min));save()};
    num('#sdef','def',1,240);num('#sbrk','brk',1,60);
    $('#sdaily').onchange=e=>{S.settings.daily=e.target.value;save()};
    $('#ssound').onclick=()=>{S.settings.sound=!S.settings.sound;save();render()};
    $('#nt').onclick=askNotif;$('#tn').onclick=()=>notify('Test ✨','Reminders are working!','test');
    q('[data-ch]',b=>b.onclick=()=>{S.settings.char=b.dataset.ch;save();render();say('Hi! I\'m '+charName()+' 💜','happy',2500)});
    $('#cu').onclick=async()=>{toast('Checking…');await checkUpdate(true);if(tab==='me')render()};
    if(NN&&NN.getInfo)NN.getInfo().then(i=>{const v=$('#ver');if(v)v.textContent='UI v'+UI_V+' · APK '+i.version+' ('+i.code+')'}).catch(()=>{});
    $('#bcopy').onclick=async()=>{toast(await copyText(JSON.stringify(S))?'Backup copied — paste it into Notes ✅':'Could not copy')};
    const bs=$('#bshare');if(bs)bs.onclick=()=>NN.shareText({text:JSON.stringify(S),title:'Nudge backup'});
    const ex=$('#exp');if(ex)ex.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='nudge-backup-'+today()+'.json';a.click()};
    $('#brest').onclick=()=>modal(`<h3>RESTORE BACKUP</h3><p>Paste the backup text you saved.</p><textarea id="rb" rows="6" placeholder="Paste here"></textarea><div class="row" style="justify-content:center;margin-top:12px"><button class="btn solid" id="rbok">Restore</button><button class="btn ghost" data-close>Cancel</button></div>`,()=>render(),el=>{
      el.querySelector('#rbok').onclick=()=>{try{const o=JSON.parse(el.querySelector('#rb').value.trim());if(!o||typeof o!=='object'||!Array.isArray(o.tasks))throw 0;S=Object.assign(def(),o);S.settings=Object.assign(def().settings,o.settings||{});delete S.hat;save();toast('Restored ✅');el._close()}catch(e){toast('That doesn\'t look like a Nudge backup')}}
    },true);
    $('#rst').onclick=()=>{if(confirm('Erase everything?')&&confirm('Really? This cannot be undone.')){S=def();save();render()}};
  }
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;if(tab==='focus')window._fsMin=false;if(tab==='today'){petMsg=msgFor(curMood())}render()});

/* ============ REMINDER LOOP (while app is open) ============ */
setInterval(()=>{
  rollover();
  const d=new Date(),n=d.getHours()*60+d.getMinutes();
  S.tasks.forEach(k=>{if(k.at&&!k.done&&!k.notified&&k.date===today()&&n>=toMin(k.at)){
    k.notified=true;save();
    if(n-toMin(k.at)<120)fgAlert('⏰ '+k.title,k.nt?'Time to do it ✅':`${k.min} min — want to start?`,'t'+k.id)}});
  const dm=S.settings.daily;
  if(dm&&S.lastNudge!==today()&&n>=toMin(dm)&&n<toMin(dm)+180){
    S.lastNudge=today();save();
    if(S.doneCount===0)fgAlert('Hi from '+charName()+' 👋',rnd(MSG.idle),'daily')}
},15000);

/* ============ BOOT ============ */
rollover();
if(S.lastBonus!==today()){
  S.lastBonus=today();const b=5+Math.min(streakAlive(),10);S.coins+=b;save();
  setTimeout(()=>toast(`Daily bonus +${b} 🪙`),600);
}
petMsg=msgFor(baseMood());
render();
if(NATIVE){
  setTimeout(()=>{LN&&LN.checkPermissions().then(p=>{if(String(p.display).startsWith('prompt'))LN.requestPermissions().then(syncNative)}).catch(()=>{})},1500);
  if(NN&&NN.getInfo)NN.getInfo().then(r=>{if(r&&r.timer){HAS_TS=true;HAS_SND2=!!r.snd2;TS_SIG='';ambSync();tsync()}}).catch(()=>{});
  queueSync();
}
setTimeout(()=>{if(Date.now()-(S.lastCheck||0)>3*3600e3)checkUpdate(false)},5000);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){try{AMB.ctx&&AMB.ctx.suspend()}catch(e){}}
  if(!document.hidden){
    try{AMB.ctx&&AMB.ctx.state==='suspended'&&AMB.ctx.resume()}catch(e){}
    rollover();
    if(S.timer&&!S.timer.paused&&remain()<=0)finishTimer();else if(tab!=='focus')render();
    if(Date.now()-(S.lastCheck||0)>3*3600e3)checkUpdate(false);
  }
});
try{localStorage.removeItem('nudge.boot')}catch(e){}
</script>

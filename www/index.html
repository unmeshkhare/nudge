<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080b14">
<title>Nudge</title>
<style>
html,body{margin:0;height:100%;background:#080b14;color:#6ff3ff;font-family:system-ui,-apple-system,sans-serif}
#b{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;letter-spacing:.3em;font-size:14px}
#b small{letter-spacing:.12em;font-size:11px;color:#7f89a8}
</style>
</head>
<body>
<div id="b">NUDGE<small>made by Unmesh Khare</small></div>
<script>
/* Nudge loader. It starts the app (app.html) and, when a newer downloaded
   version exists, starts that instead. Your data is never touched here. */
(function(){
  function get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
  function ver(h){var m=/name="nudge-ui" content="(\d+)"/.exec(h||'');return m?+m[1]:0}
  function run(html){document.open();document.write(html);document.close()}
  fetch('app.html').then(function(r){return r.text()}).then(function(bundled){
    var bv=ver(bundled),c=get('nudge.ota'),boot=get('nudge.boot'),html=bundled;
    if(boot&&boot.v>bv){ /* last downloaded version failed to start: roll back */
      try{localStorage.setItem('nudge.bad',String(boot.v));localStorage.removeItem('nudge.ota')}catch(e){}
      c=null;
    }
    try{localStorage.removeItem('nudge.boot')}catch(e){}
    if(c&&c.html&&c.v>bv&&ver(c.html)===c.v){
      html=c.html;
      try{localStorage.setItem('nudge.boot',JSON.stringify({v:c.v}))}catch(e){}
    }else if(c&&c.v<=bv){
      try{localStorage.removeItem('nudge.ota')}catch(e){}
    }
    run(html);
  }).catch(function(){
    var c=get('nudge.ota');
    if(c&&c.html)run(c.html);
    else document.getElementById('b').textContent='Could not load Nudge';
  });
})();
</script>
</body>
</html>
